name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237c5cd6&color_dots=%23ebe5ff,%23d8c8ff,%23b79cf5,%238b6fe0,%235b3fa0
            dist/github-snake-dark.svg?color_snake=%23c4b5fd&color_dots=%231c1830,%235b3fa0,%238b6fe0,%23b79cf5,%23e9d5ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
